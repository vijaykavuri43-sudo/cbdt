      - S3LM_GROQ_API_KEY=${S3LM_GROQ_API_KEY:-}
      - S3LM_GROQ_MODEL=${S3LM_GROQ_MODEL:-qwen/qwen3.8-27b}
      - S3LM_GROQ_FALLBACK_MODEL=${S3LM_GROQ_FALLBACK_MODEL:-openai/gpt-oss-120b}
      - S3LM_GROQ_VISION_MODEL=${S3LM_GROQ_VISION_MODEL:-qwen/qwen3.6-27b}
      - S3LM_GROQ_VISION_FALLBACK=${S3LM_GROQ_VISION_FALLBACK:-qwen/qwen3.8-27b}
      - S3LM_COLD_SEC=${S3LM_COLD_SEC:-1800}
      - S3LM_CRAWL_CAP=${S3LM_CRAWL_CAP:-20000}
      # This bucket IS slips (deposit/withdrawal payment screenshots) — slip
